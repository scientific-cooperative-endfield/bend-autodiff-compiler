name: Verify proofs and native implementation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BEND_NO_TELEMETRY: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install native build and font dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang fonts-liberation fontconfig
          mkdir -p "$RUNNER_TEMP/native-bin"
          ln -s /usr/bin/clang "$RUNNER_TEMP/native-bin/clang"
          echo "$RUNNER_TEMP/native-bin" >> "$GITHUB_PATH"
      - name: Install Lean pinned by lean-toolchain
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
      - name: Install the pinned Bend release
        run: |
          export BEND_HOME="$RUNNER_TEMP/bend"
          sh install.sh
          echo "$BEND_HOME/bin" >> "$GITHUB_PATH"
      - name: Install pinned Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify, rebuild, and run the complete acceptance suite
        run: ./run_checks.sh
      - name: Check repository and collect evidence
        run: python scripts/readiness.py
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-evidence
          if-no-files-found: warn
          path: |
            reports/
            evidence/
            logs/replay-*.txt
            logs/final-*.txt
            visuals/dashboard.png
            visuals/audit-*-annotated.png
